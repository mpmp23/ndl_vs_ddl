# Models used for contract rule encoding. All model calls go through OpenRouter.
# The nine NeoD models are fixed below. Fill ddl_models with exactly three
# model keys once that subset has been selected for the experiment.
models:
  claude_sonnet_45: anthropic/claude-sonnet-4.5
  deepseek_v32: deepseek/deepseek-v3.2
  gemini_pro_3.1_preview: google/gemini-3.1-pro-preview
  gpt_oss_120b: openai/gpt-oss-120b
  gpt52: openai/gpt-5.2
  kimi_k2_thinking: moonshotai/kimi-k2-thinking
  gpt6_astra: openai/gpt-6-astra
  claude_sonnet_55: anthropic/claude-sonnet-5.5
  gemini4_argon: google/gemini-4-argon

neod_models:
  - claude_sonnet_45
  - deepseek_v32
  - gemini_pro_3.1_preview
  - gpt_oss_120b
  - gpt52
  - kimi_k2_thinking
  - gpt6_astra
  - claude_sonnet_55
  - gemini4_argon

ddl_models:
  - gpt6_astra
  - claude_sonnet_55
  - gemini4_argon

# Optional model-specific request parameters; keep empty for provider defaults.
# To reproduce a particular setup, declare its actual supported parameters here
# and record them in the paper. These are passed through unchanged to OpenRouter.
request_options: {}
